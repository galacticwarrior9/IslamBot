services:
  bot:
    build: .
    container_name: islambot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.ini:/app/config.ini

  db:
    image: mysql:8.0
    container_name: islambot_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: islambot
      MYSQL_USER: islambot_user
      MYSQL_PASSWORD: islambot_password
    volumes:
      - db_data:/var/lib/mysql
    # Explicit healthcheck so the bot knows when MySQL is successfully ready
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
